name: Sentry Intake

on:
  schedule:
    # 14:00 UTC is ~6am PDT / ~7am PST. GitHub cron is UTC-only.
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: sentry-intake
  cancel-in-progress: false

jobs:
  check:
    name: Check unresolved feedback and issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # setup-node's lts/* can lag nodejs.org when a new major turns LTS; see
      # docs/foundation/engineering-policy.md#runtime-and-toolchain-versions.
      - name: Find the newest Node LTS on nodejs.org
        id: node
        shell: bash
        run: |
          version=$(curl -fsSL --retry 3 https://nodejs.org/dist/index.json |
            jq -er '[.[] | select(.lts) | .version | ltrimstr("v")] | max_by(split(".") | map(tonumber))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install Sentry CLI
        run: npm install --global sentry@latest

      - name: Create issues for new feedback
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bin/check-sentry-feedback

      - name: Create issues for new or recurring errors
        if: ${{ !cancelled() }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bin/check-sentry-issues
