name: Sentry Intake

on:
  schedule:
    # 14:00 UTC is ~6am PDT / ~7am PST. GitHub cron is UTC-only.
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: sentry-intake
  cancel-in-progress: false

jobs:
  check:
    name: Check unresolved feedback and issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true

      - name: Install Sentry CLI
        run: npm install --global sentry@latest

      - name: Create issues for new feedback
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bin/check-sentry-feedback

      - name: Create issues for new or recurring errors
        if: ${{ !cancelled() }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bin/check-sentry-issues
