name: Memory Audit

on:
  schedule:
    # Daily at 13:00 UTC (~5am PST / ~4am PDT). Job skips unless epoch-day % 3 == 0.
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: memory-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit memory notes
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Every-three-days gate
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running audit."
            exit 0
          fi
          epoch_day=$(( $(date -u +%s) / 86400 ))
          if (( epoch_day % 3 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Epoch day $epoch_day — running scheduled audit."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Epoch day $epoch_day — skipping (runs every 3 days)."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Install jq
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run memory audit cloud agent
        if: steps.gate.outputs.run == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MAX_WAIT_SECONDS: "5400"
        run: bin/run-memory-audit

      - name: Upload audit artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/memory-audit/memory-audit-report.md
            ${{ runner.temp }}/memory-audit/run-meta.json
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        run: |
          META="${{ runner.temp }}/memory-audit/run-meta.json"
          REPORT="${{ runner.temp }}/memory-audit/memory-audit-report.md"
          {
            echo "## Memory audit"
            echo ""
            if [[ -f "$META" ]]; then
              jq -r '
                "- **Status:** \(.status)",
                "- **Agent:** [\(.agentId)](\(.agentUrl))",
                "- **Completed:** \(.completedAt)",
                (if .prUrl then "- **PR:** \(.prUrl)" else "- **PR:** none (no archival changes)" end)
              ' "$META"
            fi
            echo ""
            echo "### Report preview"
            echo "\`\`\`"
            head -40 "$REPORT" || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
