name: Memory Audit

on:
  schedule:
    # Saturdays 13:00 UTC (~5am PST / ~4am PDT). GitHub cron is UTC-only.
    - cron: "0 13 * * 6"
  workflow_dispatch:

concurrency:
  group: memory-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit memory notes
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run memory audit cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MAX_WAIT_SECONDS: "5400"
        run: bin/run-memory-audit

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memory-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/memory-audit/memory-audit-report.md
            ${{ runner.temp }}/memory-audit/run-meta.json
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          META="${{ runner.temp }}/memory-audit/run-meta.json"
          REPORT="${{ runner.temp }}/memory-audit/memory-audit-report.md"
          {
            echo "## Memory audit"
            echo ""
            if [[ -f "$META" ]]; then
              jq -r '
                "- **Status:** \(.status)",
                "- **Agent:** [\(.agentId)](\(.agentUrl))",
                "- **Completed:** \(.completedAt)",
                (if .prUrl then "- **PR:** \(.prUrl)" else "- **PR:** none (no archival changes)" end)
              ' "$META"
            fi
            echo ""
            echo "### Report preview"
            echo "\`\`\`"
            head -40 "$REPORT" || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
