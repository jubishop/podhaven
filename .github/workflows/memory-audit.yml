name: Memory Audit

on:
  schedule:
    # Saturdays 13:00 UTC (~5am PST / ~4am PDT). GitHub cron is UTC-only.
    - cron: "0 13 * * 6"
  workflow_dispatch:

concurrency:
  group: memory-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit memory notes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run memory audit cloud agent
        id: audit
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MAX_WAIT_SECONDS: "5400"
        run: bin/run-memory-audit

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/memory-audit/memory-audit-report.md
            ${{ runner.temp }}/memory-audit/run-meta.json
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          META="${{ runner.temp }}/memory-audit/run-meta.json"
          REPORT="${{ runner.temp }}/memory-audit/memory-audit-report.md"
          AUDIT_OUTCOME="${{ steps.audit.outcome }}"

          {
            if [[ "$AUDIT_OUTCOME" == "success" ]]; then
              echo "## Memory audit succeeded"
            else
              echo "## Memory audit failed"
            fi
            echo ""

            if [[ -f "$META" ]]; then
              HEALTH="$(jq -r '.health' "$META")"
              case "$HEALTH" in
                ok) echo "> **Health:** ok" ;;
                degraded) echo "> **Health:** degraded — agent finished but report failed validation" ;;
                failed) echo "> **Health:** failed — agent error, timeout, or cancellation" ;;
                *) echo "> **Health:** $HEALTH" ;;
              esac
              echo ""
              jq -r '
                "- **Agent status:** \(.status)",
                "- **Report:** \(.reportSource) (valid: \(.reportValid))",
                "- **Notes:** active \(.activeNoteCount), reviewed \(.reviewedCount // "unknown")",
                "- **Agent:** [\(.agentId)](\(.agentUrl))",
                "- **Completed:** \(.completedAt)",
                (if .prUrl then "- **PR:** \(.prUrl)" else "- **PR:** none (no memory changes)" end)
              ' "$META"

              WARNINGS="$(jq -r '.warnings[]?' "$META")"
              if [[ -n "$WARNINGS" ]]; then
                echo ""
                echo "### Warnings"
                while IFS= read -r warning; do
                  echo "- $warning"
                done <<< "$WARNINGS"
              fi
            else
              echo "No run metadata found — the audit script likely failed before writing artifacts."
            fi

            echo ""
            echo "### Report preview"
            echo "\`\`\`"
            head -40 "$REPORT" 2>/dev/null || echo "(no report file)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on audit error
        if: always() && steps.audit.outcome != 'success'
        run: |
          META="${{ runner.temp }}/memory-audit/run-meta.json"
          if [[ -f "$META" ]]; then
            jq -r '"Memory audit failed (exit \(.exitCode), health \(.health))"' "$META" >&2
          else
            echo "Memory audit failed before writing run metadata" >&2
          fi
          exit 1

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          META="${{ runner.temp }}/memory-audit/run-meta.json"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LABEL="memory-audit-failure"
          TITLE="Memory audit failed (scheduled run)"

          gh label create "$LABEL" \
            --description "Scheduled memory audit workflow failure" \
            --color d73a4a \
            2>/dev/null || true

          {
            echo "The scheduled **Memory Audit** workflow failed."
            echo ""
            echo "- **Run:** $RUN_URL"
            echo "- **Completed (UTC):** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            if [[ -f "$META" ]]; then
              echo "## Run metadata"
              echo '```json'
              cat "$META"
              echo '```'
              echo ""
              WARNINGS="$(jq -r '.warnings[]?' "$META")"
              if [[ -n "$WARNINGS" ]]; then
                echo "## Warnings"
                while IFS= read -r warning; do
                  echo "- $warning"
                done <<< "$WARNINGS"
                echo ""
              fi
            else
              echo "_No run metadata was written — the audit script likely failed before the agent finished._"
              echo ""
            fi
            echo "Download the \`memory-audit-${{ github.run_id }}\` artifact from the run for the full report."
          } > /tmp/memory-audit-issue-body.md

          EXISTING_ISSUE="$(gh issue list \
            --label "$LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$EXISTING_ISSUE" ]]; then
            gh issue comment "$EXISTING_ISSUE" --body-file /tmp/memory-audit-issue-body.md
            echo "Commented on existing issue #$EXISTING_ISSUE"
          else
            gh issue create \
              --title "$TITLE" \
              --label "$LABEL" \
              --body-file /tmp/memory-audit-issue-body.md
          fi
