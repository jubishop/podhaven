name: Swift Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: swift-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Swift Tests (${{ matrix.case }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: integration
            revision: 62cbeaf3ad309127908b34f3d182efd19bb85211
          - case: pr667
            revision: 46fefff5f5b4a1ec9b70dfb34c2b0c1880a9ae90
          - case: pr668
            revision: 752fd787592b9e659027197391b3e25a08914fdc
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Preserve diagnostic log handler
        run: cp PodHavenTests/LogCapture.swift "$RUNNER_TEMP/issue676-LogCapture.swift"

      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.revision }}

      - name: Apply diagnostic log handler to recorded revision
        run: |
          cp "$RUNNER_TEMP/issue676-LogCapture.swift" PodHavenTests/LogCapture.swift
          git rev-parse HEAD
          git diff --stat
          git diff --exit-code -- . ':(exclude)PodHavenTests/LogCapture.swift'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Lint Swift
        run: bin/lint-swift-format

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p test-samples
          (
            for attempt in {1..40}; do
              test_pid=$(pgrep -x PodHaven || true)
              if [[ "$test_pid" =~ ^[0-9]+$ ]]; then
                date -u
                ps -p "$test_pid" -o pid,etime,%cpu,time,state,comm || true
                sudo sample "$test_pid" 1 10 -file "test-samples/sample-${attempt}-${test_pid}.txt" || true
              fi
              sleep 30
            done
          ) > test-samples/monitor.log 2>&1 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            -hideShellScriptEnvironment \
            -scheme PodHaven \
            -testPlan PodHaven \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipMacroValidation \
            -resultBundlePath TestResults \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions --is-ci

      - name: Print raw errors
        if: failure()
        run: |
          echo "::group::Raw xcodebuild errors"
          grep -A 3 -iE '(fatal error|assertion|precondition|trap|crash|error:)' xcodebuild.log || echo "No matching lines found"
          echo "::endgroup::"

      - name: Verify test evidence
        if: always()
        run: |
          evidence_status=0
          if [ ! -d TestResults.xcresult ]; then
            echo "::error::Missing TestResults.xcresult"
            evidence_status=1
          fi
          if [ ! -s xcodebuild.log ]; then
            echo "::error::Missing or empty xcodebuild.log"
            evidence_status=1
          fi
          exit "$evidence_status"

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-test-results-${{ matrix.case }}
          path: |
            TestResults.xcresult
            xcodebuild.log
            test-samples/
          retention-days: 7
          if-no-files-found: error

      - name: Print test failures
        if: failure()
        run: |
          json=$($(xcrun --find xcresulttool) get test-results summary \
            --path TestResults.xcresult \
            --compact 2>/dev/null) || true
          if [ -n "$json" ]; then
            echo "$json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for f in data.get('testFailures', []):
              name = f.get('testName', 'Unknown test')
              text = f.get('failureText', 'No details')
              print(f'::error title={name}::{text}')
          passed = data.get('passedTests', 0)
          failed = data.get('failedTests', 0)
          skipped = data.get('skippedTests', 0)
          print(f'\nResults: {passed} passed, {failed} failed, {skipped} skipped')
          "
          else
            echo "::error::No result bundle found — check raw errors above"
          fi
