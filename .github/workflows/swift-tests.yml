name: Swift Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: swift-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Swift Tests
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Verify current revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          PR_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git log -1 --format=fuller > ci-revision.txt
          if [ -n "$PR_HEAD_REVISION" ]; then
            git cat-file -p HEAD | grep -Fx "parent $PR_HEAD_REVISION"
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Lint Swift
        run: bin/lint-swift-format

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -hideShellScriptEnvironment \
            -scheme PodHaven \
            -testPlan PodHaven \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipMacroValidation \
            -resultBundlePath TestResults \
            LM_FORCE_LINK_GENERATION=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions --is-ci

      - name: Print raw errors
        if: failure()
        run: |
          echo "::group::Raw xcodebuild errors"
          grep -A 3 -iE '(fatal error|assertion|precondition|trap|crash|error:)' xcodebuild.log || echo "No matching lines found"
          echo "::endgroup::"

      - name: Verify test evidence
        if: always()
        run: |
          evidence_status=0
          if [ ! -d TestResults.xcresult ]; then
            echo "::error::Missing TestResults.xcresult"
            evidence_status=1
          fi
          if [ ! -s xcodebuild.log ]; then
            echo "::error::Missing or empty xcodebuild.log"
            evidence_status=1
          fi
          exit "$evidence_status"

      - name: Verify test results and warnings
        if: always()
        run: bin/check-swift-results TestResults.xcresult --build-log xcodebuild.log --full

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-test-results
          path: |
            TestResults.xcresult
            TestResults.validation
            xcodebuild.log
            ci-revision.txt
          retention-days: 7
          if-no-files-found: error

      - name: Print test failures
        if: failure()
        run: |
          json=$($(xcrun --find xcresulttool) get test-results summary \
            --path TestResults.xcresult \
            --compact 2>/dev/null) || true
          if [ -n "$json" ]; then
            echo "$json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for f in data.get('testFailures', []):
              name = f.get('testName', 'Unknown test')
              text = f.get('failureText', 'No details')
              print(f'::error title={name}::{text}')
          passed = data.get('passedTests', 0)
          failed = data.get('failedTests', 0)
          skipped = data.get('skippedTests', 0)
          print(f'\nResults: {passed} passed, {failed} failed, {skipped} skipped')
          "
          else
            echo "::error::No result bundle found — check raw errors above"
          fi
