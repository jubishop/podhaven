name: Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PodHaven \
            -testPlan PodHaven \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipMacroValidation \
            -resultBundlePath TestResults \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions --is-ci

      - name: Print test failures
        if: failure()
        run: |
          json=$($(xcrun --find xcresulttool) get test-results summary \
            --path TestResults.xcresult \
            --compact)
          echo "$json" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for f in data.get('testFailures', []):
              name = f.get('testName', 'Unknown test')
              text = f.get('failureText', 'No details')
              print(f'::error title={name}::{text}')
          if not data.get('testFailures'):
              print('::error::Tests failed but no failure details were captured')
          passed = data.get('passedTests', 0)
          failed = data.get('failedTests', 0)
          skipped = data.get('skippedTests', 0)
          print(f'\nResults: {passed} passed, {failed} failed, {skipped} skipped')
          "
