name: Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PodHaven \
            -testPlan PodHaven \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipMacroValidation \
            -resultBundlePath TestResults \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions --quiet --is-ci

      - name: Failure summary
        if: failure()
        run: |
          if [ -d TestResults.xcresult ]; then
            echo "::group::Test Failures"
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact
            echo "::endgroup::"
            echo "::group::Build Issues"
            xcrun xcresulttool get build-results --path TestResults.xcresult --compact
            echo "::endgroup::"
          else
            echo "::error::No xcresult bundle — build failed before tests ran"
          fi
